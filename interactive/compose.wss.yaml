name: remote-worker-interactive-wss
services:
  broker:
    image: paperclip-remote-worker-poc:local
    build:
      context: ..
      dockerfile: interactive/Dockerfile
    pull_policy: never
    read_only: true
    user: '1000:1000'
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    env_file: [.broker.wss.env]
    ports:
      - '127.0.0.1:3113:3113'
    networks:
      paperclip:
        aliases: [paperclip-interactive-wss-broker]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3113/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
networks:
  paperclip:
    external: true
    name: ${INTERACTIVE_PAPERCLIP_NETWORK:?Set the existing private network in .compose.wss.env}
